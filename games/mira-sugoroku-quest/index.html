<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10153b">
  <title>ミラのすごろくクエスト 体験版</title>
  <style>
    :root{--ink:#eef6ff;--muted:#b6c8f4;--navy:#10153b;--violet:#704cff;--cyan:#62e9ff;--gold:#ffd978;--pink:#ff76c8}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,"Noto Sans JP",sans-serif;background:radial-gradient(circle at 16% 8%,#4049a5 0,transparent 30%),radial-gradient(circle at 88% 18%,#683682 0,transparent 26%),#090d29}.shell{width:min(1040px,100%);margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--cyan)}h1{font-size:clamp(25px,5vw,42px);margin:4px 0}.turn{border:1px solid #9eb3ff;border-radius:999px;padding:9px 14px;background:#151d51;font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;margin-top:18px}.board{position:relative;padding:16px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;border:1px solid #7184df;border-radius:24px;background:linear-gradient(145deg,#1b2464,#10143d);box-shadow:0 18px 60px #0008}.cell{aspect-ratio:1;border:1px solid #8098ff;border-radius:16px;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,#252d71,#141a4b);font-size:24px}.cell small{font-size:10px;position:absolute;left:7px;top:5px;color:#bfcaff}.cell.goal{background:linear-gradient(135deg,#704cff,#e264cc);border-color:#ffe596}.cell.event{border-color:var(--gold);background:linear-gradient(135deg,#70552c,#352346)}.mira{font-size:31px;filter:drop-shadow(0 0 8px var(--cyan));transition:transform .35s ease}.side{border:1px solid #7184df;border-radius:24px;padding:18px;background:#111744cc}.side h2{font-size:18px;margin:0 0 10px}.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ffffff20}.eventlog{min-height:78px;margin:14px 0;padding:12px;border-radius:14px;background:#090d2b;color:#d9e7ff;line-height:1.6}button{border:0;border-radius:14px;background:linear-gradient(135deg,var(--cyan),#8d70ff);color:#07102e;font-weight:900;font-size:17px;padding:14px 20px;width:100%;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.help{font-size:13px;line-height:1.7;color:var(--muted);margin:14px 0 0}.result{display:none;position:fixed;inset:0;z-index:2;place-items:center;padding:18px;background:#070a23c9}.result.open{display:grid}.card{width:min(440px,100%);text-align:center;padding:30px;border:1px solid #9bb1ff;border-radius:25px;background:linear-gradient(145deg,#252769,#151743);box-shadow:0 25px 80px #000}.card h2{font-size:30px;margin:0 0 8px}.card p{color:#d3dfff;line-height:1.7}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{order:-1}.board{gap:7px;padding:10px}.cell{border-radius:11px;font-size:20px}}
  </style>
</head>
<body>
<main class="shell"><header class="top"><div><div class="eyebrow">MIRA VISION / DEMO</div><h1>ミラのすごろくクエスト</h1></div><div class="turn">残り <span id="turns">10</span> TURN</div></header>
<section class="layout"><div class="board" id="board" aria-label="すごろく盤"></div><aside class="side"><h2>未来へのルート</h2><div class="stat"><span>現在地</span><strong id="position">START</strong></div><div class="stat"><span>運命コイン</span><strong><span id="coins">0</span> ✦</strong></div><div class="eventlog" id="log">10ターン以内にゲートへ到達しよう。運命のサイコロを振ってね！</div><button id="roll">🎲 サイコロを振る</button><p class="help">金のマスはイベント。未来視が導く近道や、思わぬ試練が待っています。ゴール時のコイン数でランクが変わります。</p></aside></section></main>
<section class="result" id="result"><div class="card"><div id="resultIcon" style="font-size:52px">✨</div><h2 id="resultTitle"></h2><p id="resultText"></p><button id="retry">もう一度クエストへ</button></div></section>
<script>
const path=["🚀","🌌","✦","🧊","🔮","⚡","🌠","🛸","🎁","🌙","🌉","🧿","💫","🎲","👑"];
const eventCells={3:["未来視が発動！ 近道を見つけて2マス進んだ。",2,2],6:["ノイズに捕まった！ 1マス戻る。",-1,0],8:["星のかけらを発見！ 運命コイン+3。",0,3],11:["ミラの応援で加速！ 1マス進む。",1,1]};
let pos=0,turn=10,coins=0,rolling=false;const $=id=>document.getElementById(id),board=$("board");
function render(){board.innerHTML="";path.forEach((icon,i)=>{const d=document.createElement("div");d.className="cell"+(i===14?" goal":"")+(eventCells[i]?" event":"");d.innerHTML=`<small>${i===0?"START":i===14?"GOAL":String(i)}</small><span>${icon}</span>${i===pos?'<b class="mira">💙</b>':""}`;board.append(d)});$("turns").textContent=turn;$("coins").textContent=coins;$("position").textContent=pos===0?"START":pos===14?"GOAL":`${pos} マス目`}
function end(win){$("result").classList.add("open");$("resultIcon").textContent=win?"🏰":"⏳";$("resultTitle").textContent=win?"クエスト成功！":"時間切れ…";$("resultText").textContent=win?`未来のゲートに到達！ 運命コイン ${coins} 枚で${coins>=5?"S":"A"}ランクの旅でした。続きのステージは好評配信後に解放予定です。`:`あと${14-pos}マス。未来はまだ続く――もう一度、運命を振ってみよう。`;$("roll").disabled=true}
$("roll").onclick=()=>{if(rolling)return;rolling=true;$("roll").disabled=true;const die=1+Math.floor(Math.random()*6);$("log").textContent=`サイコロは ${die}！ ミラが未来へ進む…`;setTimeout(()=>{pos=Math.min(14,pos+die);turn--;let msg=`${die}マス進んだ。`;if(eventCells[pos]){const[e,move,gain]=eventCells[pos];pos=Math.max(0,Math.min(14,pos+move));coins+=gain;msg=e}render();$("log").textContent=msg;rolling=false;if(pos>=14)end(true);else if(turn<=0)end(false);else $("roll").disabled=false},550)};
$("retry").onclick=()=>{pos=0;turn=10;coins=0;$("result").classList.remove("open");$("roll").disabled=false;$("log").textContent="10ターン以内にゲートへ到達しよう。運命のサイコロを振ってね！";render()};render();
</script></body></html>
