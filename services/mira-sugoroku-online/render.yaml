services:
  - type: web
    name: mira-sugoroku-online
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: ALLOWED_ORIGINS
        value: https://mira-official.miranomiraishi.chatgpt.site
